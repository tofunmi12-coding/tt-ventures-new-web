<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Confirmation | TT Ventures</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #f4f7fb;
      color: #172033;
      font-family: Arial, sans-serif;
    }

    .payment-card {
      width: 100%;
      max-width: 480px;
      padding: 36px 26px;
      text-align: center;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
    }

    .status-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 27px;
    }

    #message {
      color: #596579;
      line-height: 1.7;
    }

    #order-reference {
      overflow-wrap: anywhere;
      font-weight: bold;
    }

    .home-link {
      display: inline-block;
      margin-top: 22px;
      padding: 13px 22px;
      border-radius: 8px;
      background: #102a56;
      color: #fff;
      text-decoration: none;
    }

    .home-link:hover {
      background: #1d4078;
    }
  </style>
</head>

<body>
  <main class="payment-card">
    <div class="status-icon" id="status-icon" aria-hidden="true">&#9203;</div>
    <h1 id="heading">Verifying your payment</h1>
    <p id="message" role="status" aria-live="polite">
      Please wait while we confirm your payment securely.
    </p>
    <p id="order-reference"></p>
    <a class="home-link" href="/" id="home-link" hidden>
      Return to TT Ventures
    </a>
  </main>

  <script src="payment-callback.js" defer></script>
</body>

</html>
